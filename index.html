<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz</title>
<style>
  body{margin:0;min-height:100dvh;display:grid;place-items:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f4ef;color:#1d1d1f;text-align:center;padding:16px}
  @media (prefers-color-scheme:dark){body{background:#141416;color:#f2f2f4}}
  p{font-size:18px;max-width:420px}
</style>
</head>
<body>
<p id="m">Ouverture du quiz…</p>
<script>
fetch('lien.json?t=' + Date.now(), {cache: 'no-store'})
  .then(r => r.json())
  .then(d => { if (d.url) location.replace(d.url); else throw 0; })
  .catch(() => { document.getElementById('m').textContent = "Le quiz n'est pas encore ouvert. Réessaie dans un instant."; });
</script>
</body>
</html>
